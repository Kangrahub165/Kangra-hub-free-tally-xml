version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kangra-hub-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - SITE_MODE=FREE
      - FREE_DAILY_PAGE_LIMIT=50
      - MAX_UPLOAD_SIZE_MB=25
      - MAX_PAGES_PER_FILE=200
      - DEFAULT_TIMEZONE=Asia/Kolkata
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      - temp_storage:/tmp/kangra_hub_tally

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kangra-hub-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    depends_on:
      - backend

volumes:
  temp_storage:
